blueprint:
  name: IKEA MYGGSPRAY E2494 Motion Sensor (Matter) v2.3
  description: 'Full-featured automation for the IKEA MYGGSPRAY E2494 Matter motion sensor. 
    Supports independent actions for motion, illuminance (high/low), battery alerts, 
    and smart manual override / automation latch.
    '
  domain: automation
  source_url: https://github.com/aledziko/HA-blueprints/blob/main/IKEA/Matter/ikea-myggspray-e2494/ikea-myggspray-e2494-matter-motion-sensor.yaml
  author: aledziko
  input:
    # Motion Settings
    motion_entity:
      name: Motion Sensor
      description: Select the motion sensor (binary_sensor).
      selector:
        entity:
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor
            - device_class: presence
              domain: binary_sensor                     
    use_time_window:
      name: Enable Active Hours?
      description: Restrict automation to a specific time window.
      default: false
      selector:
        boolean: {}
    active_start_time:
      name: Active Start Time
      description: Automation starts working at this time (if enabled).
      default: "08:00:00"
      selector:
        time: {}
    active_end_time:
      name: Active End Time
      description: Automation stops working at this time (if enabled).
      default: "22:00:00"
      selector:
        time: {}
    no_motion_wait:
      name: Wait time (Motion)
      description: Time to wait after last motion is detected before running the "off" action.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    motion_on_action:
      name: "Action: Motion Detected"
      description: Run when motion is detected (and dark enough).
      default: []
      selector:
        action: {}
    motion_off_action:
      name: "Action: Motion Stopped"
      description: Run after the sensor stops detecting motion and wait time elapsed.
      default: []
      selector:
        action: {}
    safety_delay:
      name: (Optional) Safety Delay
      description: Delay in seconds to wait for battery-powered light sensors to report their fresh value. Set to 0 for instant triggering (e.g. wired alarm sensors).
      default: 1.5
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.1
          unit_of_measurement: seconds

    # Manual Override / Automation Latch Settings
    monitored_entity:
      name: (Optional) Monitored Light / Switch
      description: >
        **Manual Override Detection**: Select the light, switch, or group entity controlled by this automation.
        If this entity is already ON when motion is detected, the blueprint assumes it was turned on manually and will NOT shut it off when motion stops.
      default: []
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch
            - domain: group
    automation_latch_helper:
      name: (Optional) Automation Latch Helper
      description: >
        **Automation Memory**: Select a Toggle helper (`input_boolean`).
        When paired with a Monitored Entity, the blueprint automatically marks this helper ON when motion turns on the light, and clears it when motion turns off the light.
        If used without a Monitored Entity, turning this helper ON manually acts as a standard bypass switch to prevent the automation from turning off the light.
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean

    # Illuminance Settings
    illuminance_entity:
      name: (Optional) Illuminance Sensor
      description: Select the light sensor (sensor.illuminance).
      default: []
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance
    motion_cutoff:
      name: "(Optional) Motion Light Cutoff"
      description: Only trigger "Motion Detected" action if LUX is BELOW this value (0 to disable).
      default: 0
      selector:
        number:
          min: 0
          max: 150000
          unit_of_measurement: lux
    illuminance_high_threshold:
      name: "(Optional) Light High Threshold"
      description: Trigger "High Action" when LUX goes ABOVE this value (0 to disable).
      default: 0
      selector:
        number:
          min: 0
          max: 150000
          unit_of_measurement: lux
    high_action:
      name: "Action: Light High"
      description: Run when light exceeds threshold (e.g. close curtains).
      default: []
      selector:
        action: {}
    illuminance_low_threshold:
      name: "(Optional) Light Low Threshold"
      description: Trigger "Low Action" when LUX goes BELOW this value (0 to disable).
      default: 0
      selector:
        number:
          min: 0
          max: 150000
          unit_of_measurement: lux
    low_action:
      name: "Action: Light Low"
      description: Run when light drops below threshold (e.g. open curtains).
      default: []
      selector:
        action: {}

    # Battery Settings
    battery_entity:
      name: (Optional) Battery Sensor
      description: Select the battery level sensor (sensor.battery).
      default: []
      selector:
        entity:
          filter:
            domain: sensor
            device_class: battery
    battery_low_threshold:
      name: (Optional) Battery Low Level
      description: Threshold for battery alert (%).
      default: 30
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    battery_low_action:
      name: "Action: Battery Low"
      description: Run when battery drops below threshold.
      default: []
      selector:
        action: {}

# Parallel mode allows motion timers and battery/light alerts to run concurrently.
mode: parallel
max_exceeded: silent

trigger_variables:
  motion_entity_input: !input motion_entity
  illuminance_entity_input: !input illuminance_entity
  motion_cutoff_input: !input motion_cutoff
  high_threshold_input: !input illuminance_high_threshold
  low_threshold_input: !input illuminance_low_threshold
  battery_entity_input: !input battery_entity
  battery_threshold_input: !input battery_low_threshold
  use_time_window_input: !input use_time_window
  safety_delay_input: !input safety_delay
  monitored_entity_input: !input monitored_entity
  automation_latch_helper_input: !input automation_latch_helper

triggers:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion_entity
    from: "on"
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off
  # Template triggers for optional entities
  - trigger: template
    value_template: >
      {{ high_threshold_input | float(0) > 0 and 
         illuminance_entity_input != none and illuminance_entity_input != [] and illuminance_entity_input != '' and 
         states(illuminance_entity_input) | is_number and 
         states(illuminance_entity_input) | float(0) > high_threshold_input | float(100000) }}
    id: light_high
  - trigger: template
    value_template: >
      {{ low_threshold_input | float(0) > 0 and 
         illuminance_entity_input != none and illuminance_entity_input != [] and illuminance_entity_input != '' and 
         states(illuminance_entity_input) | is_number and 
         states(illuminance_entity_input) | float(100000) < low_threshold_input | float(-1) }}
    id: light_low
  - trigger: template
    value_template: >
      {{ battery_entity_input != none and battery_entity_input != [] and battery_entity_input != '' and 
         states(battery_entity_input) | is_number and 
         states(battery_entity_input) | float(100) < battery_threshold_input | float(-1) }}
    id: battery_low

condition:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not use_time_window_input }}"
      - condition: time
        after: !input active_start_time
        before: !input active_end_time

actions:
  - choose:
      # MOTION ON
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          # Optional: Safety delay to allow battery-powered lux sensors to report 
          # their fresh value alongside the motion event.
          - delay:
              seconds: >-
                {% set cutoff = motion_cutoff_input | float(0) %}
                {% if cutoff == 0 or illuminance_entity_input == none or illuminance_entity_input == [] or illuminance_entity_input == '' %}
                  0
                {% else %}
                  {{ safety_delay_input | float(1.5) }}
                {% endif %}
          - condition: template
            value_template: >
              {% set cutoff = motion_cutoff_input | float(0) %}
              {% if cutoff == 0 %}
                true
              {% else %}
                {% set lux = states(illuminance_entity_input) | float(-1) %}
                {{ lux == -1 or lux <= cutoff }}
              {% endif %}
          # Smart Latch: If helper & monitored entity are configured, and the light was OFF:
          # Turn on the helper to latch that the automation took ownership.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ automation_latch_helper_input not in [none, '', []] and 
                         monitored_entity_input not in [none, '', []] and 
                         is_state(monitored_entity_input, 'off') }}
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input automation_latch_helper
          - sequence: !input motion_on_action

      # MOTION OFF
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          # Guard condition:
          # 1. If no helper configured -> proceed normally.
          # 2. If both helper & monitored entity configured -> only turn off if helper is ON (automation owns session).
          # 3. If helper configured without monitored entity -> acts as manual bypass switch (only turn off if helper is OFF).
          - condition: template
            value_template: >-
              {% set helper = automation_latch_helper_input %}
              {% set monitored = monitored_entity_input %}
              {% if helper in [none, '', []] %}
                true
              {% elif monitored not in [none, '', []] %}
                {{ is_state(helper, 'on') }}
              {% else %}
                {{ is_state(helper, 'off') }}
              {% endif %}
          - sequence: !input motion_off_action
          # Reset helper if smart latch mode was used
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ automation_latch_helper_input not in [none, '', []] and 
                         monitored_entity_input not in [none, '', []] and 
                         is_state(automation_latch_helper_input, 'on') }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input automation_latch_helper

      # LIGHT HIGH
      - conditions:
          - condition: trigger
            id: light_high
        sequence: !input high_action

      # LIGHT LOW
      - conditions:
          - condition: trigger
            id: light_low
        sequence: !input low_action

      # BATTERY LOW
      - conditions:
          - condition: trigger
            id: battery_low
        sequence: !input battery_low_action

